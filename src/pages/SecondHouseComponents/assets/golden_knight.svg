<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2f4a" />
      <stop offset="100%" stop-color="#140f1d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Pedestal Base -->
    <rect x="24" y="94" width="72" height="14" rx="4" fill="url(#baseGrad)" stroke="#fbbf24" stroke-width="3" />
    <path d="M30 94 L36 82 L84 82 L90 94 Z" fill="url(#goldGrad)" stroke="#451a03" stroke-width="2.5" />
    <!-- Knight Body & Head -->
    <path d="M38 82 C36 62, 42 48, 48 38 L34 42 L30 34 L44 22 L46 12 L56 18 C68 16, 82 26, 84 44 C86 58, 78 70, 80 82 Z"
          fill="url(#goldGrad)" stroke="#451a03" stroke-width="3" stroke-linejoin="round" />
    <!-- Mane details -->
    <path d="M62 22 C72 28, 76 40, 74 54 C72 64, 68 72, 70 80" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    <!-- Glowing Cyan Strategist Eye -->
    <circle cx="48" cy="28" r="3.5" fill="#22d3ee" stroke="#083344" stroke-width="1.5" />
  </g>
</svg>
