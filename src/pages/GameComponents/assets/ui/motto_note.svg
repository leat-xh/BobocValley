<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Parchment shadow -->
  <rect x="10" y="8" width="28" height="34" fill="#201320" opacity="0.45" />
  <!-- Parchment page -->
  <rect x="8" y="6" width="28" height="34" fill="#faedd0" />
  <rect x="8" y="6" width="28" height="34" fill="none" stroke="#5a3416" stroke-width="2" />
  <!-- Folded corner top-right -->
  <polygon points="30,6 36,12 30,12" fill="#d49b55" stroke="#5a3416" stroke-width="1.5" />
  <!-- Inscribed Motto Text Lines -->
  <rect x="12" y="14" width="15" height="2" fill="#7a461e" />
  <rect x="12" y="19" width="20" height="2" fill="#7a461e" />
  <rect x="12" y="24" width="18" height="2" fill="#7a461e" />
  <rect x="12" y="29" width="12" height="2" fill="#7a461e" />
  <!-- Royal Crimson Wax Seal -->
  <circle cx="28" cy="33" r="5" fill="#a72222" stroke="#5c1010" stroke-width="1.5" />
  <rect x="26" y="31" width="4" height="4" fill="#e85d5d" />
</svg>
